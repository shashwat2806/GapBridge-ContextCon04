{"docs/architecture.svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1280\" height=\"760\" viewBox=\"0 0 1280 760\" role=\"img\" aria-labelledby=\"title desc\">\n<title id=\"title\">GapBridge Local Auditor architecture</title>\n<desc id=\"desc\">A local policy document flows through parsing, retrieval, Ollama analysis, exact quote verification, and local report artifacts. No cloud service is called.</desc>\n<defs>\n  <linearGradient id=\"bg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#102b3f\"/><stop offset=\"1\" stop-color=\"#164f58\"/></linearGradient>\n  <marker id=\"arrow\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#55c4b2\"/></marker>\n  <filter id=\"shadow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"8\" stdDeviation=\"10\" flood-color=\"#071b28\" flood-opacity=\".18\"/></filter>\n</defs>\n<rect width=\"1280\" height=\"760\" rx=\"26\" fill=\"#f2f7f7\"/>\n<path d=\"M26 0h1228a26 26 0 0 1 26 26v148H0V26A26 26 0 0 1 26 0z\" fill=\"url(#bg)\"/>\n<text x=\"64\" y=\"58\" fill=\"#8de1d1\" font-family=\"Arial,sans-serif\" font-size=\"16\" font-weight=\"700\" letter-spacing=\"3\">GAPBRIDGE · LOCAL AUDITOR</text>\n<text x=\"64\" y=\"112\" fill=\"#ffffff\" font-family=\"Arial,sans-serif\" font-size=\"36\" font-weight=\"700\">From policy file to review-ready work</text>\n<text x=\"64\" y=\"148\" fill=\"#d2e7e8\" font-family=\"Arial,sans-serif\" font-size=\"17\">Evidence-grounded analysis stays on the builder's machine.</text>\n\n<g filter=\"url(#shadow)\">\n  <rect x=\"56\" y=\"226\" width=\"250\" height=\"152\" rx=\"18\" fill=\"#ffffff\" stroke=\"#cfe1e2\"/>\n  <rect x=\"354\" y=\"226\" width=\"250\" height=\"152\" rx=\"18\" fill=\"#ffffff\" stroke=\"#cfe1e2\"/>\n  <rect x=\"652\" y=\"226\" width=\"250\" height=\"152\" rx=\"18\" fill=\"#ffffff\" stroke=\"#cfe1e2\"/>\n  <rect x=\"950\" y=\"226\" width=\"274\" height=\"152\" rx=\"18\" fill=\"#ffffff\" stroke=\"#cfe1e2\"/>\n</g>\n<path d=\"M309 302h36M607 302h36M905 302h36\" stroke=\"#168c82\" stroke-width=\"4\" marker-end=\"url(#arrow)\"/>\n<g font-family=\"Arial,sans-serif\">\n  <text x=\"82\" y=\"264\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.4\">01 · INTAKE</text>\n  <text x=\"82\" y=\"300\" fill=\"#17384a\" font-size=\"21\" font-weight=\"700\">Policy document</text>\n  <text x=\"82\" y=\"332\" fill=\"#607887\" font-size=\"15\">PDF · DOCX · TXT · Markdown</text>\n  <text x=\"82\" y=\"355\" fill=\"#607887\" font-size=\"15\">Original remains unchanged</text>\n\n  <text x=\"380\" y=\"264\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.4\">02 · EXTRACT</text>\n  <text x=\"380\" y=\"300\" fill=\"#17384a\" font-size=\"21\" font-weight=\"700\">Local parser</text>\n  <text x=\"380\" y=\"332\" fill=\"#607887\" font-size=\"15\">Sections · passage IDs</text>\n  <text x=\"380\" y=\"355\" fill=\"#607887\" font-size=\"15\">PDF page references</text>\n\n  <text x=\"678\" y=\"264\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.4\">03 · RETRIEVE</text>\n  <text x=\"678\" y=\"300\" fill=\"#17384a\" font-size=\"21\" font-weight=\"700\">Local evidence search</text>\n  <text x=\"678\" y=\"332\" fill=\"#607887\" font-size=\"15\">Nomic embeddings + lexical</text>\n  <text x=\"678\" y=\"355\" fill=\"#607887\" font-size=\"15\">Lexical fallback if needed</text>\n\n  <text x=\"976\" y=\"264\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.4\">04 · REASON</text>\n  <text x=\"976\" y=\"300\" fill=\"#17384a\" font-size=\"21\" font-weight=\"700\">Ollama · Qwen 2.5</text>\n  <text x=\"976\" y=\"332\" fill=\"#607887\" font-size=\"15\">One requirement at a time</text>\n  <text x=\"976\" y=\"355\" fill=\"#607887\" font-size=\"15\">Quote · status · draft clause</text>\n</g>\n\n<path d=\"M1087 386v76H307v48M1087 462H641v48M1087 462H1000v48\" fill=\"none\" stroke=\"#168c82\" stroke-width=\"4\" marker-end=\"url(#arrow)\"/>\n<g filter=\"url(#shadow)\">\n  <rect x=\"56\" y=\"522\" width=\"502\" height=\"154\" rx=\"18\" fill=\"#e6f5f2\" stroke=\"#a7d8d0\"/>\n  <rect x=\"590\" y=\"522\" width=\"206\" height=\"154\" rx=\"18\" fill=\"#ffffff\" stroke=\"#cfe1e2\"/>\n  <rect x=\"828\" y=\"522\" width=\"206\" height=\"154\" rx=\"18\" fill=\"#ffffff\" stroke=\"#cfe1e2\"/>\n  <rect x=\"1066\" y=\"522\" width=\"158\" height=\"154\" rx=\"18\" fill=\"#ffffff\" stroke=\"#cfe1e2\"/>\n</g>\n<g font-family=\"Arial,sans-serif\">\n  <text x=\"82\" y=\"558\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.4\">05 · VERIFY BEFORE REPORTING</text>\n  <text x=\"82\" y=\"596\" fill=\"#17384a\" font-size=\"21\" font-weight=\"700\">Exact-quote evidence gate</text>\n  <text x=\"82\" y=\"627\" fill=\"#607887\" font-size=\"15\">Every quote must exist in its cited passage.</text>\n  <text x=\"82\" y=\"650\" fill=\"#607887\" font-size=\"15\">Invalid or unclear results go to human review.</text>\n\n  <text x=\"610\" y=\"558\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.2\">OUTPUT A</text>\n  <text x=\"610\" y=\"596\" fill=\"#17384a\" font-size=\"18\" font-weight=\"700\">Evidence report</text>\n  <text x=\"610\" y=\"628\" fill=\"#607887\" font-size=\"14\">HTML · Markdown</text>\n\n  <text x=\"848\" y=\"558\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.2\">OUTPUT B</text>\n  <text x=\"848\" y=\"596\" fill=\"#17384a\" font-size=\"18\" font-weight=\"700\">Policy draft</text>\n  <text x=\"848\" y=\"628\" fill=\"#607887\" font-size=\"14\">Owner-approved clauses</text>\n\n  <text x=\"1086\" y=\"558\" fill=\"#087d76\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.2\">OUTPUT C</text>\n  <text x=\"1086\" y=\"596\" fill=\"#17384a\" font-size=\"17\" font-weight=\"700\">Roadmap</text>\n  <text x=\"1086\" y=\"628\" fill=\"#607887\" font-size=\"14\">Priority + proof</text>\n</g>\n<text x=\"64\" y=\"720\" fill=\"#607887\" font-family=\"Arial,sans-serif\" font-size=\"13\">Local endpoint: 127.0.0.1:11434  ·  No cloud calls  ·  Policy text is not a proof of operating effectiveness</text>\n</svg>\n"}